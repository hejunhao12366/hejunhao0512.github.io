<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>理财</title>
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="理财" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=44" />
  </head>
  <body data-mode="school">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <div class="mode-switch" id="modeSwitch">
            <button class="mode-opt active" type="button" data-mode="school">在校</button>
            <button class="mode-opt" type="button" data-mode="holiday">假期</button>
          </div>
          <time id="nowText" class="time-text"></time>
        </div>
        <div class="top-actions">
          <div class="undo-redo-group">
            <button id="undoButton" class="ur-btn" type="button" aria-label="撤销">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 8L5 12l4 4"/>
                <path d="M9 8h7a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H9"/>
              </svg>
            </button>
            <span class="ur-divider"></span>
            <button id="redoButton" class="ur-btn" type="button" aria-label="恢复">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 8l4 4-4 4"/>
                <path d="M15 8H8a4 4 0 0 0-4 4v0a4 4 0 0 0 4 4h7"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="calculatorView" class="app-view active">
        <section class="daily-panel app-card" aria-labelledby="dailyTitle">
          <div class="section-kicker" id="dailyKicker">今天</div>
          <h2 id="dailyTitle">每天可用</h2>
          <div class="daily-highlight">
            <div class="daily-highlight-head">
              <span>每天</span>
              <span id="dailyFormulaText"></span>
            </div>
            <div class="daily-highlight-value">
                <span class="daily-highlight-number" id="dailyCanUseText"></span>
                <span class="daily-highlight-unit">/ 天</span>
              </div>
            </div>
            <div class="countdown-card" id="countdownCard">
              <span class="countdown-label" id="daysLabel">距发生活费</span>
              <div class="countdown-number-wrap">
                <span class="countdown-number" id="daysText"></span>
                <span class="countdown-unit">天</span>
              </div>
            </div>
            <div id="balanceCards" class="balance-cards"></div>
            <div class="total-strip">
              <span>总余额</span>
              <span class="tag purple" id="totalBalanceText"></span>
            </div>
          <button id="saveDailyRecordButton" class="primary wide record-save-button" type="button">保存今日记录</button>
        </section>

        <section class="summary-section app-card hero-card" aria-labelledby="debtTitle">
          <div class="section-kicker">欠款总览</div>
          <h1 id="debtTitle">总欠</h1>
          <div class="formula-line" id="debtFormula"></div>
          <div class="repay-progress">
            <div class="repay-progress-label">
              <span>已还</span>
              <span id="repayProgressPercent"></span>
            </div>
            <div class="repay-progress-bar">
              <div class="repay-progress-fill" id="repayProgressFill"></div>
            </div>
          </div>
        </section>

        <section class="month-panel app-card" aria-labelledby="repayTitle">
          <div class="section-kicker">本月</div>
          <h2 id="repayTitle">还款后生活费</h2>
          <div class="formula-line large" id="repayFormula"></div>

          <div class="badge">可用余额：</div>
          <div class="balance-row">
            <span>- 不分期：</span>
            <span id="livingFeeText"></span>
            <span>-</span>
            <span class="tag purple" id="normalRepayText"></span>
            <span>=</span>
            <span class="tag mint" id="normalLeftText"></span>
          </div>
          <div class="balance-row">
            <span>- 分期：</span>
            <span id="livingFeeSplitText"></span>
            <span>-</span>
            <span class="tag purple" id="splitRepayText"></span>
            <span>=</span>
            <span class="tag mint" id="splitLeftText"></span>
          </div>
          <div class="note-pill" id="installmentNote"></div>
        </section>

      </div>

      <div id="recordsView" class="app-view">
        <section class="app-card hero-card">
          <div class="section-kicker">历史记录</div>
          <h1>总可用</h1>
          <div class="record-summary" id="recordSummary"></div>
        </section>

        <section class="app-card trend-card">
          <div class="section-header">
            <h2>余额走势</h2>
          </div>
          <div id="trendChart" class="trend-chart-container"></div>
        </section>

        <section class="app-card report-card">
          <div class="section-header">
            <h2>月报表</h2>
            <span id="reportMonthLabel" class="report-month-label"></span>
          </div>
          <div id="monthlyReport" class="monthly-report"></div>
        </section>

        <section class="app-card">
          <div class="section-header">
            <h2>每天记录</h2>
            <button id="clearRecordsButton" class="ghost-button" type="button">清空</button>
          </div>
          <div id="dailyRecordsList" class="records-list"></div>
        </section>
      </div>

      <div id="settingsView" class="app-view">
        <section class="app-card settings-hero">
          <div class="section-kicker">设置</div>
          <h1>数据中心</h1>
          <p class="settings-copy">输入、备注和同步都集中在这里。计算页只看结果，会更清爽一点。</p>
        </section>


        <section class="app-card settings-card sync-card">
          <div class="sync-head">
            <div>
              <div class="section-kicker">同步助手</div>
              <h2>账号同步</h2>
            </div>
            <span id="syncStatus">未开启</span>
          </div>
          <p class="sync-help">这里像登录账号一样填一次。填完后会自动同步，数据正确的入口可以点"用这台覆盖云端"，其他入口点"用云端恢复这台"。</p>
          <div class="sync-login">
            <label>
              GitHub Token
              <input id="syncTokenInput" type="password" placeholder="只保存在你的浏览器里" autocomplete="off" />
            </label>
            <label>
              云存档 ID
              <input id="syncGistInput" type="text" placeholder="创建后自动填写" />
            </label>
          </div>
          <div class="sync-actions">
            <button id="createCloudButton" class="ghost-button" type="button">创建云存档</button>
            <button id="pushCloudButton" class="primary" type="button">用这台覆盖云端</button>
            <button id="pullCloudButton" class="ghost-button" type="button">用云端恢复这台</button>
          </div>
        </section>

        <section class="app-card settings-card">
          <div class="section-header">
            <h2>分期与周期</h2>
          </div>
          <form id="debtForm" class="settings-form">
            <div class="form-group">
              <div class="form-group-legend">分期设置</div>
              <div class="form-row-pair">
                <label>
                  分期金额
                  <input id="installmentAmountInput" type="number" min="0" step="0.01" />
                </label>
                <label>
                  分期期数
                  <input id="installmentMonthsInput" type="number" min="1" step="1" />
                </label>
              </div>
              <label class="wide">
                分期说明
                <textarea id="installmentNoteInput" maxlength="60" placeholder="例如：突发情况时用"></textarea>
              </label>
            </div>
            <div class="form-group">
              <div class="form-group-legend">周期设置</div>
              <label class="school-only">
                每月发生活费日
                <input id="paydayDayInput" type="number" min="1" max="31" step="1" />
              </label>
              <label class="holiday-only">
                假期目标天数
                <input id="holidayDaysInput" type="number" min="1" step="1" />
              </label>
            </div>
            <button class="primary wide" type="submit">保存</button>
          </form>
        </section>



        <section class="app-card settings-card">
          <div class="section-header">
            <h2>特殊情况备注</h2>
          </div>
          <form id="noteForm2" class="settings-form">
            <label class="wide">
              日期
              <input id="noteDateInput" type="date" required />
            </label>
            <label class="wide">
              备注内容
              <textarea id="noteTextInput" maxlength="80" placeholder="例如：临时省 300，改成 285/12"></textarea>
            </label>
            <button class="primary wide" type="submit" id="addNoteButton">添加备注</button>
          </form>
        </section>

        <section class="timeline-section app-card settings-card" aria-labelledby="notesTitle">
          <div class="section-header">
            <h2 id="notesTitle">特殊情况</h2>
          </div>
          <div id="notesList" class="timeline"></div>
        </section>
      </div>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" type="button" data-view="calculatorView">计算</button>
        <button class="nav-item" type="button" data-view="recordsView">记录</button>
        <button class="nav-item" type="button" data-view="settingsView">设置</button>
      </nav>
    </main>

    <script src="./app.js?v=44"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        // Unregister any old service workers first
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
        // Register SW (original path for update detection)
        navigator.serviceWorker.register("./service-worker.js", { updateViaCache: "none" }).then((reg) => {
          // Force immediate update check
          reg.update();
          reg.addEventListener("updatefound", () => {
            const sw = reg.installing;
            sw.addEventListener("statechange", () => {
              if (sw.state === "activated" && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        });
      }
    </script>
  </body>
</html>
